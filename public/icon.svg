<!--
Quran Daily favicon — SVG source of truth
- Concept: an open book (mushaf) with a crescent above, symbolising daily Quran reading.
- Colour: emerald primary (matches theme_color #0B7A3E), gold accent for the crescent.
- Grid: 512×512 canvas, safe-area 64px inset for maskable variants.
- No purple/violet/fuchsia/indigo per user preference.
- License: this file is CC0 — free to reuse.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quran Daily">
  <title>Quran Daily</title>

  <!-- Background: deep-emerald square with generous corner radius so it looks
       right both as a favicon and as a rounded app tile. -->
  <rect width="512" height="512" rx="96" fill="#0B7A3E"/>

  <!-- Subtle geometric watermark — 8-point star, Islamic geometric tradition. -->
  <g fill="#0A6635" opacity="0.7">
    <path d="M256 42
             L286 116 L364 116 L302 162 L326 236
             L256 190 L186 236 L210 162 L148 116 L226 116 Z"/>
  </g>

  <!-- Crescent — gold — top-right, standalone symbol -->
  <path d="M 386 120
           a 46 46 0 1 1 -20 88
           a 34 34 0 1 0 20 -88 Z"
        fill="#F5C542"/>

  <!-- Open book (mushaf): two facing pages, gently tilted -->
  <g transform="translate(56 236)">
    <!-- Left page -->
    <path d="M0 30
             Q 20 10 200 20
             L 200 200
             Q 20 190 0 210 Z"
          fill="#FFFCF2" stroke="#F5C542" stroke-width="4"/>
    <!-- Right page -->
    <path d="M200 20
             Q 380 10 400 30
             L 400 210
             Q 380 190 200 200 Z"
          fill="#FFFFFF" stroke="#F5C542" stroke-width="4"/>
    <!-- Spine shadow -->
    <line x1="200" y1="20" x2="200" y2="200" stroke="#0B7A3E" stroke-width="3" opacity="0.35"/>
    <!-- Text lines on left page (Arabic-direction rhythm, decorative) -->
    <g fill="#0B7A3E" opacity="0.55">
      <rect x="30"  y="60"  width="140" height="7" rx="3"/>
      <rect x="50"  y="86"  width="120" height="7" rx="3"/>
      <rect x="30"  y="112" width="140" height="7" rx="3"/>
      <rect x="60"  y="138" width="110" height="7" rx="3"/>
      <rect x="30"  y="164" width="140" height="7" rx="3"/>
    </g>
    <!-- Text lines on right page -->
    <g fill="#0B7A3E" opacity="0.55">
      <rect x="230" y="60"  width="140" height="7" rx="3"/>
      <rect x="230" y="86"  width="120" height="7" rx="3"/>
      <rect x="230" y="112" width="140" height="7" rx="3"/>
      <rect x="230" y="138" width="110" height="7" rx="3"/>
      <rect x="230" y="164" width="140" height="7" rx="3"/>
    </g>
  </g>
</svg>
