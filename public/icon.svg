<!--
Quran Daily favicon — v3, clean & distinctive
Concept:
  - Emerald rounded-square background
  - A stylised open-book silhouette formed by two symmetrical crescents that
    together create the shape of an open mushaf. This is the unique mark —
    two mirrored crescents ARE the pages of the open book, referencing both
    Islamic iconography (crescent) and scripture (open book) in one shape.
  - Gold star centered above where the pages meet (the "spine")
- Colour: emerald + gold. No purple/violet/fuchsia/indigo.
- Legibility: tested to survive 16×16 favicon rendering — mark is bold shapes,
  no thin details.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quran Daily">
  <title>Quran Daily</title>

  <!-- Rounded-square background -->
  <rect width="512" height="512" rx="96" fill="#0B7A3E"/>

  <!-- Subtle geometric inner ring for depth (skipped at small sizes visually) -->
  <rect x="28" y="28" width="456" height="456" rx="72"
        fill="none" stroke="#0A6635" stroke-width="4" opacity="0.6"/>

  <!-- Left "page" of the mushaf — a crescent opening to the right -->
  <path d="M 96 160
           A 176 176 0 0 1 240 160
           A 132 132 0 0 0 96 160 Z"
        fill="#F5C542"
        transform="rotate(-8 168 200)"/>

  <!-- Right "page" of the mushaf — mirrored crescent opening to the left -->
  <path d="M 272 160
           A 176 176 0 0 1 416 160
           A 132 132 0 0 0 272 160 Z"
        fill="#F5C542"
        transform="rotate(8 344 200)"/>

  <!-- Central spine / gutter — a slim vertical gold line marks the fold -->
  <rect x="252" y="140" width="8" height="120" rx="4" fill="#F5C542"/>

  <!-- Gold 5-pointed star hovering above the book, evoking guidance -->
  <path d="M 256 60
           l 14 30 l 33 4 l -24 22 l 6 32 l -29 -16 l -29 16 l 6 -32 l -24 -22 l 33 -4 Z"
        fill="#F5C542"/>

  <!-- Bold wordmark "Quran Daily" below the book, all-caps sans, tight tracking.
       This is the DISTINCTIVE element — most Islamic favicons don't include
       type, so this becomes memorable. Uses generic sans that renders on
       every OS (Helvetica / Arial / DejaVu fallback chain). -->
  <text x="256" y="380"
        font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"
        font-size="76"
        font-weight="800"
        text-anchor="middle"
        letter-spacing="2"
        fill="#FFFCF2">QURAN</text>

  <text x="256" y="450"
        font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"
        font-size="48"
        font-weight="600"
        text-anchor="middle"
        letter-spacing="8"
        fill="#F5C542">DAILY</text>
</svg>
