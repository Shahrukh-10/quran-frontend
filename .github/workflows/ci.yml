name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push on the same branch cancels the previous run — we only care
  # about the latest commit's CI result on any given branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo-boost: skip Next's telemetry ping, keep node's memory footprint modest.
  NEXT_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Stage 1: fast lint + typecheck + unit tests. Under 60s on cached deps.
  # Anything longer belongs downstream so first-look feedback stays fast.
  quality:
    name: Lint · Typecheck · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome lint
        run: pnpm lint

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Vitest unit tests
        run: pnpm test

  # Stage 2: production build → E2E smoke + axe a11y across all page templates.
  # Only runs if quality gates pass, so a lint failure doesn't waste 5 minutes.
  e2e:
    name: E2E · Playwright + axe
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production bundle
        run: pnpm build

      - name: Run Playwright tests (smoke + a11y)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # Stage 3: Lighthouse CI for perf/a11y/SEO/best-practices score gates.
  # Runs against the production build so perf numbers actually mean something.
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          # Public storage means anyone with the report URL can view it —
          # matches the "no login, no private data" ethos of the site itself.
          # To keep reports private, swap to LHCI_TOKEN + a private server.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
